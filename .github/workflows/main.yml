name: huluxia_signin
on:
  schedule:
    - cron: '0 16 * * *'  # 24点
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: '初始化python环境'
        uses: actions/setup-python@v4
        with:
          python-version: 3.10.11
      - name: '安装依赖'
        run: |
          pip install --upgrade pip
          pip install -r ./requirements.txt
      - name: '开始运行（带重试）'
        id: signin-outputs
        env:
          NOTIFIER_TYPE: ${{ secrets.NOTIFIER_TYPE }}
          EMAIL_CONFIG: ${{ secrets.EMAIL_CONFIG }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
        run: |
          # 重试逻辑
          max_retries=3
          retry_delay=1200  # 1分钟 = 60秒
          
          for i in $(seq 1 $max_retries); do
            echo "第 $i 次尝试运行..."
            if python ./main.py; then
              echo "运行成功！"
              exit 0
            else
              echo "运行失败"
              if [ $i -lt $max_retries ]; then
                echo "等待 $retry_delay 秒后重试..."
                sleep $retry_delay
              else
                echo "已达到最大重试次数 $max_retries"
                exit 1
              fi
            fi
          done
